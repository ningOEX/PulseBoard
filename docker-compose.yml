services:
  mongo:
    image: mongo:6
    container_name: panel-mongo
    restart: unless-stopped
    # 2G 内存服务器，限制 mongo 缓存大小避免 OOM
    command: mongod --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo-data:/data/db
    networks:
      - panel-net

  server:
    build:
      context: ./server
    container_name: panel-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/panel_chat
    depends_on:
      - mongo
    networks:
      - panel-net

  web:
    build:
      context: ./web
    container_name: panel-web
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - server
    networks:
      - panel-net

volumes:
  mongo-data:

networks:
  panel-net:
    driver: bridge
