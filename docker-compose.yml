services:
  mongo:
    image: mongo:6
    container_name: pulseboard-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - pulseboard-net

  server:
    build:
      context: ./server
    container_name: pulseboard-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 连接同网络内的 mongo 容器，容器名即主机名
      MONGODB_URI: mongodb://mongo:27017/panel_chat
    depends_on:
      - mongo
    networks:
      - pulseboard-net

  web:
    build:
      context: ./web
    container_name: pulseboard-web
    restart: unless-stopped
    # 仅本机监听，供外层 Nginx 反代
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - server
    networks:
      - pulseboard-net

volumes:
  mongo-data:

networks:
  pulseboard-net:
    driver: bridge
