server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源：去掉 /board/ 前缀后从 root 查找（dist 目录无 board 子目录）
    location /board/ {
        rewrite ^/board/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # REST API 反代到后端容器
    location /board/api/ {
        proxy_pass http://panel-server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO 反代（需支持 WebSocket 升级）
    location /board/socket.io/ {
        proxy_pass http://panel-server:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 根路径重定向到 /board/
    location = / {
        return 301 /board/;
    }
}
