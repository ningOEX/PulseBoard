server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源与路由（构建产物已带 /board/ 前缀）
    location /board/ {
        try_files $uri $uri/ /board/index.html;
    }

    # REST API 反代到后端容器
    location /board/api/ {
        proxy_pass http://pulseboard-server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO 反代（需支持 WebSocket 升级）
    location /board/socket.io/ {
        proxy_pass http://pulseboard-server:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 根路径重定向到 /board/
    location = / {
        return 301 /board/;
    }
}
